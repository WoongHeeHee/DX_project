name: market_explorer_frontend
description: 시장 탐방 서비스 Flutter 웹앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 상태 관리
  provider: ^6.1.1

  # 라우팅
  go_router: ^13.0.0

  # HTTP 클라이언트
  dio: ^5.4.0

  # 환경 변수
  flutter_dotenv: ^5.1.0

  # Google Sign-In (웹)
  google_sign_in: ^6.2.1

  # 이미지 처리
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # 위치 서비스
  geolocator: ^11.0.0

  # 지도
  google_maps_flutter: ^2.5.0

  # 유틸리티
  intl: ^0.20.2
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  package_info_plus: ^5.0.1
  path: ^1.8.3

  # UI
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
  # .env 파일은 flutter_dotenv가 직접 로드하므로 assets에 등록할 필요 없음
