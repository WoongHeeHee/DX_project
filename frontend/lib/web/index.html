<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="시장 탐방 서비스">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="시장 탐방">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>시장 탐방</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // 환경에 따라 API_BASE_URL 자동 설정 + 쿼리 파라미터 오버라이드 지원
    // 즉시 실행 함수로 Flutter 앱 초기화 전에 window.ENV 설정 보장
    (function() {
      try {
        const hostname = window.location.hostname;
        const protocol = window.location.protocol;
        const params = new URLSearchParams(window.location.search);
        const override = params.get('api_base');
        
        // IPv4 주소 체크 (정규식 수정: 이스케이프 제거)
        const isIpv4Host = /^\d+\.\d+\.\d+\.\d+$/.test(hostname);
        let apiBaseUrl;
        
        if (override && override.trim() !== '') {
          apiBaseUrl = override.trim();
          console.log('[ENV] 🔧 api_base 쿼리 파라미터로 API_BASE_URL 오버라이드: ' + apiBaseUrl);
        } else if (hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '0.0.0.0') {
          // 로컬 개발 (localhost)
          apiBaseUrl = 'http://localhost:8000';
          console.log('[ENV] 🔧 로컬 개발 환경 감지 - API_BASE_URL: ' + apiBaseUrl);
        } else if (isIpv4Host) {
          // 같은 네트워크 대역에서 IP로 접속 시 로컬 백엔드로 연결
          apiBaseUrl = `http://${hostname}:8000`;
          console.log('[ENV] 🔧 로컬 IP 접속 감지 - API_BASE_URL: ' + apiBaseUrl);
        } else {
          // 프로덕션: Cloudflare 터널 설정에 따라 백엔드 주소 결정
          // 옵션 1: 서브도메인 사용 (api.sijanggo.com)
          // 옵션 2: 같은 도메인 사용 (sijanggo.com) - 경로 기반 라우팅 필요
          // 현재는 서브도메인 방식으로 설정 (필요시 수정)
          const apiSubdomain = 'api.' + hostname;
          // 프로덕션 환경에서는 항상 HTTPS 사용 (Mixed Content 방지)
          // sijanggo.com 도메인은 항상 HTTPS로 접근하므로 API도 HTTPS 사용
          apiBaseUrl = 'https://' + apiSubdomain;
          console.log('[ENV] 🌐 프로덕션 환경 감지 - hostname: ' + hostname);
          console.log('[ENV] 🌐 프로덕션 환경 감지 - protocol: ' + protocol);
          console.log('[ENV] 🌐 프로덕션 환경 감지 - API_BASE_URL: ' + apiBaseUrl);
          console.log('[ENV] 💡 Cloudflare 터널에서 api.sijanggo.com이 localhost:8000으로 라우팅되어야 합니다.');
        }
        
        // window.ENV 설정 (Flutter 앱이 읽을 수 있도록)
        window.ENV = {
          API_BASE_URL: apiBaseUrl,
          GOOGLE_CLIENT_ID: '584089307412-hfnij6j84iqfr5gj3m45ef7ue1f3k5je.apps.googleusercontent.com',
          GOOGLE_MAPS_API_KEY: 'AIzaSyByKS4TYVcqPYor-594VP0BTwcQPKaEQFg',
        };
        
        // 설정 확인 로그
        console.log('[ENV] ✅ window.ENV 설정 완료:', window.ENV);
        console.log('[ENV] ✅ API_BASE_URL:', window.ENV.API_BASE_URL);
        
        // 전역 변수로도 설정 (호환성)
        if (typeof window !== 'undefined') {
          window.__API_BASE_URL__ = apiBaseUrl;
        }
      } catch (error) {
        console.error('[ENV] ❌ window.ENV 설정 중 오류 발생:', error);
        // 기본값 설정
        window.ENV = {
          API_BASE_URL: 'http://localhost:8000',
          GOOGLE_CLIENT_ID: '584089307412-hfnij6j84iqfr5gj3m45ef7ue1f3k5je.apps.googleusercontent.com',
          GOOGLE_MAPS_API_KEY: 'AIzaSyByKS4TYVcqPYor-594VP0BTwcQPKaEQFg',
        };
      }
    })();
  </script>

  <!-- Google Identity Services 스크립트 -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Google Maps API 스크립트 (동기 로드, async/defer 제거) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyByKS4TYVcqPYor-594VP0BTwcQPKaEQFg&libraries=places"></script>
  <script>
    // Google Maps API 로드 여부 플래그 설정
    (function() {
      if (typeof google !== 'undefined' && google.maps) {
        console.log('[Google Maps] ✅ Google Maps API 동기 로드 완료');
        window.googleMapsApiReady = true;
        const event = new Event('googleMapsApiReady');
        window.dispatchEvent(event);
      } else {
        console.error('[Google Maps] ❌ Google Maps API 로드 실패 또는 지연');
        window.googleMapsApiReady = false;
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      font-family: Roboto, sans-serif;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
