version: '3.8'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.3
    container_name: market_explorer_postgres
    environment:
      POSTGRES_DB: market_explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - market_explorer_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: market_explorer_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - market_explorer_network

  # MinIO (S3 호환 객체 스토리지)
  minio:
    image: minio/minio:latest
    container_name: market_explorer_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - market_explorer_network

  # Celery Worker
  celery_worker:
    build: .
    container_name: market_explorer_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/market_explorer
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    networks:
      - market_explorer_network

  # Celery Beat (스케줄러)
  celery_beat:
    build: .
    container_name: market_explorer_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/market_explorer
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    networks:
      - market_explorer_network

  # FastAPI 애플리케이션
  api:
    build: .
    container_name: market_explorer_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/market_explorer
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=market-explorer-photos
      - S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - market_explorer_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  market_explorer_network:
    driver: bridge
